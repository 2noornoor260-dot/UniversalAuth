name: Android CI

on:
  push:
    branches: [ "a15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build and publish xposedutil to mavenLocal
      run: |
        git clone https://github.com/null-dev/XposedUtil.git /tmp/XposedUtil
        cd /tmp/XposedUtil
        git checkout 1.1 2>/dev/null || true
        python3 -c '
        p = "library/build.gradle"
        s = open(p).read()
        i = s.find("publishing {")
        if i != -1:
            open(p, "w").write(s[:i] + "\nafterEvaluate {\n" + s[i:] + "\n}\n")
        '
        chmod +x gradlew
        if ! ./gradlew publishToMavenLocal -PveptaGitlabPackageRegistryPersonalToken=dummy; then
          python3 -c '
        p = "library/build.gradle"
        s = open(p).read()
        i = s.find("afterEvaluate {")
        if i != -1:
            open(p, "w").write(s[:i])
        '
          ./gradlew :library:assembleRelease
          mvn install:install-file \
            -Dfile=library/build/outputs/aar/library-release.aar \
            -DgroupId=ax.nd.xposedutil \
            -DartifactId=xposedutil \
            -Dversion=1.1 \
            -Dpackaging=aar \
            -DgeneratePom=true
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Xposed APK
      run: ./gradlew :universalauth-xposed:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: universalauth-xposed-a15
        path: universalauth-xposed/build/outputs/apk/debug/*.apk
