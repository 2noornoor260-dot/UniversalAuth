name: Android CI

on:
  push:
    branches: [ "a15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Xposed APK
      run: ./gradlew :universalauth-xposed:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: universalauth-xposed-a15
        path: universalauth-xposed/build/outputs/apk/debug/*.apk
