name: Android CI

on:
  push:
    branches: [ "a15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build and publish xposedutil to mavenLocal
      run: |
        SUBMOD=$(find . -maxdepth 2 -iname "*xposedutil*" -type d | head -n 1)
        if [ -n "$SUBMOD" ] && [ -f "$SUBMOD/gradlew" ]; then
          cd "$SUBMOD"
        else
          git clone https://github.com/null-dev/XposedUtil.git /tmp/XposedUtil
          cd /tmp/XposedUtil
          git checkout 1.1 2>/dev/null || true
        fi
        chmod +x gradlew
        ./gradlew publishToMavenLocal

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Xposed APK
      run: ./gradlew :universalauth-xposed:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: universalauth-xposed-a15
        path: universalauth-xposed/build/outputs/apk/debug/*.apk
