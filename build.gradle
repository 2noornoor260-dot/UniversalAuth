// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.3.1' apply false
    id 'com.android.library' version '8.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.6.10' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// تطبيق التعرّف على الوجه (يتغيّر في هذا الإصدار)
configure ([project(':faceunlock')]) {
    afterEvaluate {
        android {
            defaultConfig {
                versionCode 1010000
                versionName "1.10.0"
            }
        }
    }
}

// وحدة Xposed: لم يتغيّر فيها شيء ولا في بروتوكول البثّ، فيبقى رقمها كما هو (لا حاجة لإعادة تثبيتها)
configure ([project(':universalauth-xposed')]) {
    afterEvaluate {
        android {
            defaultConfig {
                versionCode 1009000
                versionName "1.9.0"
            }
        }
    }
}